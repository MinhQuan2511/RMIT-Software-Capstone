<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        /* Entrance animation for the login card */
        @keyframes fade-in-up {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .animate-entrance {
            animation: fade-in-up 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
<body class="bg-background min-h-screen flex items-center justify-center relative overflow-hidden font-body-md text-body-md text-on-surface antialiased">
<!-- Subtle Blueprint Background Layer -->
<div class="absolute inset-0 z-0 opacity-[0.03] pointer-events-none" data-alt="A highly detailed, subtle digital blueprint pattern suitable for an industrial high-tech UI background. The image features incredibly fine, precise technical grid lines and sparse abstract architectural or geometric diagrams. The style is explicitly light-mode, utilizing an extremely low-contrast palette of very faint cool gray lines against a pristine white background. The overarching aesthetic is precision minimalism, conveying a sense of engineered stability and operational control without drawing attention away from the foreground elements." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBIu6Lj54uf7ctw2Hm4y5C0R0hKyKxC5-TFODBOAWj-HThbFF8MhZGOzHFGsUof8-j5eFctHyC9kpVFhzXC-JvYL1yGG4whAfAomc2oc0viCGKszvxHxK0v-fI7IBJNwIhp45AFK5NjyEdjr1LzH3NoDAqEzxZf9yBK9I4sdYwM8kaOIDylutWyCKhYpkPSNfi6zaDfaOiSjhitomLSQ2JnroYCFfWGMXsf5Wy49IHGu63rDB6KnytUcDNk0lyYHlZ2ZR2MujPCwFg'); background-size: cover; background-position: center;">
</div>
<!-- Login Surface (Level 2 Elevation) -->
<div class="relative z-10 w-full max-w-[440px] mx-margin-mobile bg-surface-container-lowest border border-outline-variant rounded-xl shadow-[0_12px_24px_-12px_rgba(0,0,0,0.1)] p-8 animate-entrance flex flex-col gap-8">
<!-- Header -->
<div class="flex flex-col items-center text-center gap-2">
<div class="w-12 h-12 rounded-lg bg-surface-container-low flex items-center justify-center border border-outline-variant mb-2">
<span class="material-symbols-outlined text-primary text-3xl" data-weight="fill" style="font-variation-settings: 'FILL' 1;">
                    precision_manufacturing
                </span>
</div>
<h1 class="font-headline-md text-headline-md text-on-surface">Vertex Dynamics</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Scan-to-Path Hub Authentication</p>
</div>
<!-- Interactive Form Area -->
<form class="flex flex-col gap-6" onsubmit="event.preventDefault();">
<!-- Role Selection Toggle -->
<div class="flex p-1 bg-surface-container-low rounded-lg border border-outline-variant/50">
<button class="flex-1 py-2 px-3 rounded text-center transition-all bg-surface-container-lowest shadow-sm border border-outline-variant/20 font-label-md text-label-md text-on-surface" id="role-operator" onclick="toggleRole('operator')" type="button">
                    Standard Operator
                </button>
<button class="flex-1 py-2 px-3 rounded text-center transition-all text-on-surface-variant hover:text-on-surface font-label-md text-label-md" id="role-engineer" onclick="toggleRole('engineer')" type="button">
                    System Engineer
                </button>
</div>
<!-- Inputs Container -->
<div class="flex flex-col gap-4">
<!-- ID/Email Input -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface" for="userId">Operator ID / Engineer Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline pointer-events-none text-[20px]">
                            badge
                        </span>
<input class="w-full h-10 pl-10 pr-3 bg-surface border border-outline-variant rounded font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="userId" placeholder="Enter credentials" type="text"/>
</div>
</div>
<!-- PIN/Password Input -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface flex justify-between" for="securityCode">
<span>Security PIN / Password</span>
</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline pointer-events-none text-[20px]">
                            lock
                        </span>
<input class="w-full h-10 pl-10 pr-10 bg-surface border border-outline-variant rounded font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="securityCode" placeholder="••••••••" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface transition-colors focus:outline-none flex items-center justify-center" type="button">
<span class="material-symbols-outlined text-[20px]">
                                visibility
                            </span>
</button>
</div>
</div>
</div>
<!-- Footer Actions -->
<div class="flex flex-col gap-4 pt-2">
<button class="w-full h-10 bg-primary hover:bg-on-primary-fixed-variant text-on-primary rounded font-label-md text-label-md flex items-center justify-center gap-2 transition-colors active:scale-[0.98]" type="submit">
<span class="material-symbols-outlined text-[18px]">
                        login
                    </span>
                    Authenticate &amp; Initialize
                </button>
<div class="flex justify-between items-center px-1">
<label class="flex items-center gap-2 cursor-pointer group">
<input class="w-4 h-4 rounded border-outline-variant text-primary focus:ring-primary focus:ring-offset-background bg-surface cursor-pointer" type="checkbox"/>
<span class="font-body-md text-body-md text-on-surface-variant group-hover:text-on-surface transition-colors">Remember terminal</span>
</label>
<a class="font-body-md text-body-md text-primary hover:underline transition-all" href="#">Recovery Protocol</a>
</div>
</div>
</form>
<!-- System Status Footer -->
<div class="mt-auto pt-4 border-t border-outline-variant/50 flex justify-between items-center">
<div class="flex items-center gap-1.5">
<div class="w-2 h-2 rounded-full bg-[#10b981]"></div>
<span class="font-code-md text-code-md text-on-surface-variant text-[11px]">SYS: ONLINE</span>
</div>
<span class="font-code-md text-code-md text-outline text-[11px]">v2.4.1-stable</span>
</div>
</div>
<!-- Micro-interaction script for the role toggle -->
<script>
        function toggleRole(selectedRole) {
            const operatorBtn = document.getElementById('role-operator');
            const engineerBtn = document.getElementById('role-engineer');
            
            // Define active and inactive class strings based on Tailwind config
            const activeClasses = ['bg-surface-container-lowest', 'shadow-sm', 'border', 'border-outline-variant/20', 'text-on-surface'];
            const inactiveClasses = ['text-on-surface-variant', 'border-transparent'];
            
            if (selectedRole === 'operator') {
                operatorBtn.classList.add(...activeClasses);
                operatorBtn.classList.remove(...inactiveClasses);
                
                engineerBtn.classList.remove(...activeClasses);
                engineerBtn.classList.add(...inactiveClasses);
            } else {
                engineerBtn.classList.add(...activeClasses);
                engineerBtn.classList.remove(...inactiveClasses);
                
                operatorBtn.classList.remove(...activeClasses);
                operatorBtn.classList.add(...inactiveClasses);
            }
        }
    </script>
</body></html>
